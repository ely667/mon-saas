[phases.setup]
nixPkgs = ["php84", "php84Extensions.mbstring", "php84Extensions.dom", "php84Extensions.curl", "php84Extensions.bcmath", "php84Extensions.sqlite3", "php84Extensions.pdo_sqlite", "php84Extensions.tokenizer", "php84Extensions.xml"]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader", "npm install && npm run build"]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
