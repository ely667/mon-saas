[phases.setup]
nixPkgs = ["nodejs", "php83", "php83Extensions.mbstring", "php83Extensions.dom", "php83Extensions.curl", "php83Extensions.bcmath", "php83Extensions.sqlite3", "php83Extensions.pdo_sqlite", "php83Extensions.tokenizer", "php83Extensions.xml"]
env = { PHP_INI_SCAN_DIR = "+/app" }

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader", "npm ci", "npm run build", "mkdir -p storage/framework/{sessions,cache,views} storage/logs storage/app/public bootstrap/cache", "chmod -R 775 storage bootstrap/cache", "touch database/database.sqlite", "php artisan storage:link --force", "php artisan migrate --force"]

[start]
cmd = "touch database/database.sqlite && php artisan migrate --force && php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=$PORT"
